<style>
:root {
  color-scheme: light;
  --bg: #f5f4f3;
  --panel: #fff;
  --edge: #dedbd8;
  --ink: #191717;
  --muted: #665e5c;

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, sans-serif; }
button, input, select, textarea { font: inherit; }
button, a, input, textarea, select { outline-offset: 4px; }
:focus-visible { outline: 3px solid #ce4147; }
button {

}
button:hover { border-color: var(--red); }
a { color: var(--red); text-underline-offset: 3px; }
.shell { display: grid; grid-template-columns: 236px minmax(0,1fr); min-height: 100vh; }
aside {
  background: #181616; color: white; padding: 26px 16px; position: sticky;

.brand { display: flex; align-items: center; gap: 12px; margin: 0 7px 32px; }

.mono, .label, .badge {

.muted, .mono { color: var(--muted); }

main { width: 100%; max-width: 1320px; margin-inline: auto; padding: 28px clamp(18px,4vw,52px) 60px; }

<script>
const workspaceOrigin = 'https://ingenuity-24220-biobuzz.chivalrouspalm.chatgpt.site';
let workspaceWindow;
let connectionTimeout;
let connected = false;
const pendingRecords = new Map();

function connectSharedRecords() {
  if (workspaceWindow && !workspaceWindow.closed && connected) {
    workspaceWindow.focus();
    return;
  }
  workspaceWindow = window.open(workspaceOrigin + '/connect', 'ingenuity-team-workspace', 'popup,width=530,height=440');
  if (!workspaceWindow) throw Error('Allow pop-ups for this page, then try again.');
  connected = false;
  clearTimeout(connectionTimeout);
  connectionTimeout = setTimeout(() => {
    document.querySelector('#notice').textContent = 'Sign in to Season HQ in the connection window, then return here and select Connect team workspace again.';
  }, 5000);
}

window.addEventListener('message', event => {
  if (event.origin !== workspaceOrigin || event.source !== workspaceWindow) return;
  const message = event.data;
  if (message?.type === 'ingenuity-ready') {
    connected = true;
    clearTimeout(connectionTimeout);
    document.querySelector('#connection').hidden = true;
    refresh();
  }
  if (message?.type === 'ingenuity-response') {
    const pending = pendingRecords.get(message.id);
    if (!pending) return;
    pendingRecords.delete(message.id);
    clearTimeout(pending.timer);
    pending.resolve(new Response(message.body, {status:message.status}));
  }
});

function requestRecords(method, record) {
  if (!connected || !workspaceWindow || workspaceWindow.closed) {
    connected = false;
    document.querySelector('#connection').hidden = false;
    throw Error('Connect the team workspace to load or save shared records.');
  }
  return new Promise((resolve, reject) => {
    const id = crypto.randomUUID();
    const timer = setTimeout(() => {
      pendingRecords.delete(id);
      connected = false;
      document.querySelector('#connection').hidden = false;
      reject(Error('The workspace connection timed out. Reconnect and refresh before retrying.'));
    }, 12000);
    pendingRecords.set(id, {resolve, timer});
    workspaceWindow.postMessage({type:'ingenuity-request', id, method, record}, workspaceOrigin);
  });
}

const awardNames = ['Inspire','Think','Connect','Reach','Sustain','Design','Innovate','Control','Judges’ Choice'];
const sections = ['Overview','Goals',...awardNames,'Rules','Events','Meetings'];
const recordCategories = ['Awards','Goals','Rules','Events','Meetings'];
const awardGuide = {
  Inspire: 'Bring together the strongest robot, team, and portfolio evidence. Track gaps across the award areas.',
  Think: 'Capture engineering decisions, iterations, and the evidence that explains what the team learned.',
  Connect: 'Track student skill-development goals and relationships with STEM professionals.',
  Reach: 'Record outreach activities, who participated, and what impact the work had.',
  Sustain: 'Track fundraising, financial planning, role transitions, and team continuity.',
  Design: 'Collect CAD, subsystem integration, and the trade-offs behind robot design choices.',
  Innovate: 'Document novel mechanisms, prototypes, test results, and what makes the solution distinctive.',
  Control: 'Track autonomous routines, sensors, software, and Pedro Pathing tuning evidence.',
  'Judges’ Choice': 'Capture distinctive team efforts. FIRST lists this award as optional.'
};
const awardManual = 'https://ftc-resources.firstinspires.org/ftc/archive/2027/game/manual-06';
const legacySections = {Robot:'Design',Autonomous:'Control',Outreach:'Reach'};
function awardsFor(record) {
  if (Array.isArray(record.awards)) return record.awards;
  if (record.category === 'Autonomous') return ['Control'];
  if (record.category === 'Robot') return record.id === 'starter-7' ? ['Design','Innovate'] : ['Design'];
  if (record.category === 'Outreach') return /fundrais|sponsor|budget/i.test(record.title) ? ['Sustain'] : ['Reach'];
  return [];
}
const statusList = ['Planned','In progress','Blocked','Done'];
const names = {Awards:'Award evidence',Overview:'Overview',Goals:'Goals & ownership',Rules:'Rules & clarifications',Robot:'Robot build',Autonomous:'Autonomous lab',Outreach:'Outreach & fundraising',Events:'Event prep',Meetings:'Meeting log'};
for (const award of awardNames) names[award] = award + ' Award';
const descriptions = {Goals:'Set season outcomes, assign leads, and confirm what success looks like.',Rules:'Search rule IDs, topics, sources, and team interpretations. Check FIRST for the latest official ruling.',Robot:'Track CAD, prototypes, fabrication, and tests. Add evidence and the next build decision.',Autonomous:'Record tuning experiments and Pedro Pathing issues, including what changed and what the robot did.',Outreach:'Track outreach activities, sponsor conversations, and fundraising follow-ups.',Events:'Check off inspection, pit, judging, and drive-team tasks. Add an event name to task titles when reusing the checklist.',Meetings:'Record decisions, mark completed meetings, and assign follow-ups as entries with owners and due dates.'};
const manual = 'https://ftc-resources.firstinspires.org/ftc/game';
const seeds = [
['Goals','Build a reliable match robot','Zilong · CAD lead','Define success with repeatable cycle and reliability tests. Confirm the build lead and target before committing.','Agree on first prototype test'],
['Goals','Run a repeatable autonomous routine','Programming lead','Choose a baseline routine, record completion rate, and define the fallback path.','Agree on a minimum success rate'],
['Goals','Document outreach and fund the season','Elaine and Sherry · outreach co-leads','Build on Ingenuity’s public commitment to community outreach and open-source code. Confirm a fundraising owner, funding target, and outreach target.','Confirm budget and outreach targets','https://ingenuity.team/'],
['Goals','Keep team decisions and handoffs current','Erik and Nathan · team co-captains','Starting roster from the team site: Coach Dai (head coach), Coach Wan (assistant coach), Mentor Ni (hardware mentor), and Max (outreach specialist). Confirm assignments for BIOBUZZ.','Confirm season owners at the next meeting','https://ingenuity.team/'],
['Rules','BIOBUZZ competition manual and Team Updates','','Official FIRST resource index for the current manual, revisions, and game materials. Record a rule ID and revision when saving a team interpretation.','',manual,false],

$('#nav').innerHTML = sections.map(s =>
  (s==='Inspire'?'<div class="nav-heading mono">Judged awards</div>':s==='Rules'?'<div class="nav-heading mono">Team operations</div>':'')+

  const check = r.category==='Events' ? '<label class="checkline"><input type="checkbox" data-check="'+r.id+'" '+(r.status==='Done'?'checked':'')+' aria-label="Complete '+esc(r.title)+'"> Complete</label>' : '';

nf1cqlUqlUqlUKpVKVfX6fzx5ZpPZt7d8AAAAAElFTkSuQmCC" width="577" height="552" alt="Team Ingenuity logo"></section><div class="stats">'+tile(goals.length,'Season goals')+tile(records.filter(r=>r.status==='In progress').length,'In progress')+tile(records.filter(r=>r.status==='Blocked').length,'Blocked')+tile(after.length,last?'Updated since meeting':'Updated entries')+'</div><div class="cols"><section><div class="heading"><h2>Season goals</h2><button data-section="Goals">All goals →</button></div><div class="list">'+list(goals.slice(0,4))+'</div></section><section class="list" style="align-content:start"><div class="panel fresh"><h2>Since last meeting</h2><p class="muted">'+(last?'Showing updates from '+esc(date(last.due))+' onward.':'Showing recent updates until a dated meeting is marked Done.')+'</p>'+(after.length?'<ul>'+after.slice(0,8).map(r=>'<li><button data-edit="'+r.id+'">'+esc(r.title)+'</button><br><small class="muted">'+esc(r.status)+' · '+esc(date(r.updated))+'</small></li>').join('')+'</ul>':'<p class="empty">No changes to review yet.</p>')+'</div><div class="panel"><h2>Follow-ups</h2><ul>'+tasks.slice(0,6).map(r=>'<li><button data-edit="'+r.id+'">'+esc(r.next)+'</button><br><small class="muted">'+esc(r.owner||'Unassigned')+(r.due?' · '+esc(date(r.due)):'')+'</small></li>').join('')+'</ul></div></section></div>';

function filtered(){
  const terms=query.toLowerCase().trim().split(/\s+/);
  const matches=records.filter(r=>(awardNames.includes(section) ? awardsFor(r).includes(section) : r.category===section) && (!filter||r.status===filter) && terms.every(term=>[r.title,r.notes,r.owner,r.source,r.next].join(' ').toLowerCase().includes(term)));
  if(section==='Meetings') matches.sort((a,b)=>(b.due||'').localeCompare(a.due||''));
  $('#items').innerHTML=list(matches);
}
function render(){
  $('#crumb').textContent=names[section];
  $('#nav').querySelectorAll('button').forEach(b=>b.dataset.section===section?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  if(section==='Overview'){$('#view').innerHTML=overview();return;}
  $('#view').innerHTML='<section class="hero"><div><span class="label">Team Ingenuity / Season HQ</span><h1>'+names[section]+'</h1><p>'+(awardGuide[section]||descriptions[section])+'</p>'+(awardGuide[section]?'<p><a style="color:#ffb8bb" href="'+awardManual+'" target="_blank" rel="noopener">FIRST award criteria ↗</a></p>':'')+'</div></section><div class="toolbar"><input id="query" type="search" aria-label="Search this section" placeholder="'+(section==='Rules'?'Search rule ID, topic, or clarification…':'Search this section…')+'"><select id="filter" aria-label="Filter by status"><option value="">All statuses</option>'+statusList.map(s=>'<option>'+s+'</option>').join('')+'</select>'+(section==='Meetings'?'<button id="template">＋ Use meeting template</button>':'')+'</div><div class="list" id="items"></div>';
  $('#query').value=query; $('#filter').value=filter;
  $('#query').oninput=e=>{query=e.target.value;filtered();};
  $('#filter').onchange=e=>{filter=e.target.value;filtered();};
  if($('#template')) $('#template').onclick=()=>openEditor(null,'Meetings',true);
  filtered();
}
function navigate(target){
  target=legacySections[target]||target;
  section=sections.includes(target)?target:'Overview'; query=''; filter=''; render();
}
function openEditor(record, category, useTemplate=false){
  editing=record;
  form.reset();
  const selectedAward=awardNames.includes(category)?category:null;
  form.elements.category.value=(record && (legacySections[record.category]?'Awards':record.category))||(selectedAward?'Awards':category);
  const selectedTags=record?awardsFor(record):selectedAward?[selectedAward]:[];
  for (const checkbox of form.querySelectorAll('[name="awards"]')) checkbox.checked=selectedTags.includes(checkbox.value);
  form.elements.status.value=record?.status||'Planned';
  for(const key of ['title','owner','due','notes','next','source','by']) form.elements[key].value=record?.[key]||'';
  form.elements.tentative.checked=record?.tentative??false;
  if(useTemplate){form.elements.title.value='Team meeting';form.elements.notes.value=template; const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());form.elements.due.value=now.toISOString().slice(0,10);}
  $('#editor-title').textContent=record?'Edit entry':'New entry';
  $('#form-error').textContent='';
  editor.showModal();
}
async function refresh(){
  try {
    const res=await requestRecords('GET');
    if(!res.ok) throw Error('Shared storage is temporarily unavailable. Starter entries are visible while you reconnect.');
    const remote=await res.json();
    const map=new Map(seeds.map(r=>[r.id,r]));
    for(const r of remote) map.set(r.id,r);
    records=[...map.values()];online=true;$('#notice').textContent='';render();
  }catch(e){online=false;$('#notice').textContent=e.message;}
}
async function save(record){
  if(!online) throw Error('Shared storage is offline. Refresh the page connection and try again.');
  const res=await requestRecords('PUT', record);
  const data=await res.json();
  if(!res.ok)throw Error(data.error||'Unable to save.');
  records=[...records.filter(r=>r.id!==data.id),data];render();
}
form.onsubmit=async event=>{
  event.preventDefault(); if(saving)return;
  saving=true; $('#save').disabled=true; $('#form-error').textContent='';
  try{
    const fields=new FormData(form);
    const values=Object.fromEntries(fields);
    values.awards=fields.getAll('awards');
    values.tentative=form.elements.tentative.checked;
    if (values.category==='Awards' && !values.awards.length) throw Error('Select at least one award tag for this entry.');
    if(values.category==='Meetings'&&values.status==='Done'&&!values.due)throw Error('Set the meeting date before marking it Done.');
    await save({...values,id:editing?.id||crypto.randomUUID(),revision:editing?.revision||0});
    editor.close();$('#notice').textContent='Entry saved to the shared workspace.';
  }catch(e){$('#form-error').textContent=e.message;}
  finally{saving=false;$('#save').disabled=false;}
};
$('#add').onclick=()=>openEditor(null,section==='Overview'?'Goals':section);
$('#close').onclick=$('#cancel').onclick=()=>{if(!saving)editor.close();};
editor.addEventListener('cancel',event=>{if(saving)event.preventDefault();});
$('#refresh').onclick=refresh;
document.addEventListener('click',event=>{
  const btn=event.target.closest('button');
  if(btn?.dataset.section){location.hash=encodeURIComponent(btn.dataset.section);navigate(btn.dataset.section);}
  if(btn?.dataset.edit){const record=records.find(r=>r.id===btn.dataset.edit);if(record)openEditor(record);}
});
document.addEventListener('change',async event=>{
  const control=event.target;
  if(!control.dataset.check)return;
  const record=records.find(r=>r.id===control.dataset.check);
  control.disabled=true;
  try{await save({...record,status:control.checked?'Done':'Planned'});$('#notice').textContent='Checklist updated.';}
  catch(e){control.checked=!control.checked;$('#notice').textContent=e.message;}
  finally{control.disabled=false;}
});
function sectionFromHash() {
  try { return decodeURIComponent(location.hash.slice(1)); }
  catch { return 'Overview'; }
}
window.addEventListener('hashchange',()=>navigate(sectionFromHash()));
navigate(sectionFromHash());
if (connectSharedRecords) {
  $('#connection').hidden = false;
  $('#connect').onclick = () => {
    try { connectSharedRecords(); }
    catch (error) { $('#notice').textContent = error.message; }
  };
} else refresh();
</script>
</html>
